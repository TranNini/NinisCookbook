# Reachable from other devices (the iPhone); they need the access code once
server.address=0.0.0.0
# 8080 is used by the Vocab app, 8081 by TradeLog
server.port=8082

# All recipes (with their photos), the shopping list and the settings live in this file.
# In Docker it is in /app/data instead (see the Dockerfile).
spring.datasource.url=jdbc:sqlite:cookbook.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time
spring.datasource.hikari.maximum-pool-size=1
# Runs schema.sql on every start; it only creates the tables that are missing
spring.sql.init.mode=always

# A copy of the database every night at 03:30, kept this many days; see Backup
cookbook.backup-dir=backups
cookbook.backup-days=30
# Created on first start; delete it to get a new code (devices then need to log in again)
cookbook.access-code-file=access-code.txt

# The jar gives every file the same 1980 date, so browsers would keep old copies of index.html.
# Make them ask for the current file every time.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true

# Behind caddy (https://cookbook.kulose.de) the app itself only sees http: redirects are sent as "/login.html"
# instead of "http://…/login.html", so the browser stays on https
server.tomcat.use-relative-redirects=true
